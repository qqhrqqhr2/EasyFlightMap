name: Release
on:
  push:
    branches: [main, master]
    paths: [CHANGELOG.md]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_KEY" || { echo 'Set the CF_API_KEY repository secret first.'; exit 1; }
          grep -q '^## X-Curse-Project-ID: 1736991$' EasyFlightMap.toc
      - name: Create version tag and dispatch tagged release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' CHANGELOG.md | head -n1)
          test -n "$ver"
          grep -q "^## Version: $ver$" EasyFlightMap.toc
          tag="v$ver"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)" || { echo 'Existing tag points to a different commit.'; exit 1; }
          else
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi
          gh workflow run release.yml --ref "$tag"
      - name: Package and publish to GitHub and CurseForge
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1736991
